# LAN deployment: students open http://<server-ip>:8080.
# Copy .env.example to .env and set real secrets before `make up`.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    # No published port: only api/worker reach the DB over the internal network.
    networks: [db]

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      HTTP_ADDR: ":8080"
      DATA_DIR: /data
    ports:
      # Bound on all interfaces so LAN clients can connect.
      - "0.0.0.0:${API_PORT:-8080}:8080"
    volumes:
      - data:/data
    networks: [db, web]

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_DIR: /data
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    volumes:
      # Same volume as api: api writes sources/tests, worker reads them.
      - data:/data
    # Only the internal `db` network: the worker can reach PostgreSQL but has
    # no route to the LAN/Internet.
    #
    # To be implemented in the judge step: submitted programs must additionally
    # run with networking disabled (separate network namespace / no sockets),
    # a wall-clock + CPU timeout, and memory/process/output limits via
    # setrlimit, as an unprivileged user, never inside the worker's own
    # privileges. This container boundary alone is NOT the sandbox.
    networks: [db]

networks:
  db:
    internal: true
  web: {}

volumes:
  pgdata: {}
  data: {}
