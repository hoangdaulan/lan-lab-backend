# Override for the UDP features (docs/net-protocols.md §2-3): the API joins
# the host's network so its broadcast/multicast datagrams reach the lab LAN
# (they never leave Docker's NAT bridge otherwise).
#
#   docker compose -f docker-compose.yml -f docker-compose.lan.yml up -d --build
#
# Firewall: sudo ufw allow 8080/tcp && sudo ufw allow 8443/tcp \
#           && sudo ufw allow 9999/udp && sudo ufw allow 9998/udp

services:
  api:
    network_mode: host
    networks: !reset null
    ports: !reset []
    environment:
      # PostgreSQL as published on the host (127.0.0.1:DB_PORT).
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${DB_PORT:-5433}/${POSTGRES_DB}?sslmode=disable
      HTTP_ADDR: ":${API_PORT:-8080}"
      HTTPS_ADDR: ":${API_HTTPS_PORT:-8443}"
      DISPATCH_ADDR: ":${DISPATCH_PORT:-7070}"
      DISCOVERY_PORT: ${DISCOVERY_PORT:-9999}
      ANNOUNCE_MULTICAST_ADDR: ${ANNOUNCE_MULTICAST_ADDR:-239.255.42.99:9998}

  worker:
    # The API is now on the host: reach it through the host gateway. The
    # worker gets the web network for that route; student programs still
    # run in an empty network namespace.
    networks: [db, web]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORKER_DISPATCH_ADDR: host.docker.internal:${DISPATCH_PORT:-7070}
