swagger: '2.0'
info:
  title: LAN Auto-Grader API
  version: 1.0.0
  description: API hiện đã triển khai. Đăng nhập trước, bấm Authorize và nhập Bearer <access_token>. Đổi
    token khi đổi vai trò. Chỉnh ngày giờ phiên theo lúc test. Bài nộp được worker chấm thật (g++ C++17
    trong sandbox); kết quả dạng passed/total + verdict, dừng ở test sai đầu tiên. Chấm lại problem hoặc
    từng bài đã hoạt động. WebSocket /api/v1/ws (không nằm trong Swagger vì không phải REST) đẩy run.updated,
    summary.updated, announcement — xem docs/api-v1.md mục Chi tiết WebSocket.
basePath: /
produces:
- application/json
securityDefinitions:
  BearerAuth:
    type: apiKey
    in: header
    name: Authorization
    description: 'Nhập cả tiền tố: Bearer <access_token>. Token giáo viên dùng cho quản lý, token sinh
      viên dùng join/finish.'
security:
- BearerAuth: []
paths:
  /healthz:
    get:
      tags:
      - Hệ thống
      summary: Kiểm tra API và kết nối database
      operationId: get__healthz
      parameters: []
      responses:
        '200':
          description: Thành công
        '400':
          description: Dữ liệu không hợp lệ
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Thiếu/sai/hết hạn token hoặc thông tin đăng nhập
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Không đủ quyền
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Không tìm thấy
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Xung đột trạng thái hoặc dữ liệu
          schema:
            $ref: '#/definitions/Error'
      security: []
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Đăng nhập
      description: Body chỉ gồm code và password; vai trò (teacher/student) lấy từ tài khoản trong DB
        và trả về trong user.role + claim role của JWT. Gửi thêm trường role sẽ bị 400.
      operationId: post__api_v1_auth_login
