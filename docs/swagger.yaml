definitions:
  Error:
    type: object
    properties:
      error:
        type: string
        example: Thông báo lỗi
  Login:
    type: object
    properties:
      code:
        type: string
        example: GV01
      password:
        type: string
        example: Thay bằng mật khẩu đã seed
    required:
    - code
    - password
  Refresh:
    type: object
    properties:
      refresh_token:
        type: string
        example: Dán refresh_token mới nhất từ login/refresh
    required:
    - refresh_token
  Password:
    type: object
    properties:
      current_password:
        type: string
        example: TESTSV001
      new_password:
        type: string
        example: TestPass2026!
        maxLength: 72
    required:
    - current_password
    - new_password
  StudentInput:
    type: object
    properties:
      code:
        type: string
        example: TESTSV001
      fullname:
        type: string
        example: Nguyễn Văn An
    required:
    - code
    - fullname
  ExamInput:
    type: object
    properties:
      title:
        type: string
        example: Đề test API
      description:
        type: string
        example: Kiểm tra luồng làm bài
    required:
    - title
  SessionInput:
    type: object
    properties:
      name:
        type: string
        example: Phiên test
      starts_at:
        type: string
        example: '2026-10-22T00:00:00+07:00'
        format: date-time
      ends_at:
        type: string
        example: '2026-10-23T00:00:00+07:00'
        format: date-time
    required:
    - name
    - starts_at
    - ends_at
  ProblemInput:
    type: object
    properties:
      code:
        type: string
        example: A
      title:
        type: string
        example: Tổng hai số
      statement:
        type: string
        example: Nhập hai số nguyên a, b. In tổng a + b.
      time_limit_ms:
        type: integer
        minimum: 1
        maximum: 10000
        example: 1000
      memory_limit_mb:
        type: integer
        minimum: 1
        maximum: 1024
        example: 256
    required:
    - code
    - title
    - time_limit_ms
    - memory_limit_mb
  User:
    type: object
    properties:
      id:
        type: integer
        format: int64
        example: 1
      role:
        type: string
      code:
        type: string
      fullname:
        type: string
  Tokens:
    type: object
    properties:
      access_token:
        type: string
      access_expires_at:
        type: string
        format: date-time
      refresh_token:
        type: string
      refresh_expires_at:
        type: string
        format: date-time
      user:
        $ref: '#/definitions/User'
  Participant:
    type: object
    properties:
      id:
        type: integer
        format: int64
        example: 1
      session_id:
        type: integer
        format: int64
        example: 1
      student_id:
        type: integer
        format: int64
        example: 1
      student_code:
        type: string
      student_fullname:
        type: string
      status:
        type: string
        enum:
        - in_progress
        - finished
      joined_at:
        type: string
        format: date-time
      finished_at:
        type: string
        format: date-time
        x-nullable: true
  Exam:
    type: object
    properties:
      id:
        type: integer
        format: int64
        example: 1
      title:
        type: string
      description:
        type: string
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
  Session:
    type: object
    properties:
      id:
        type: integer
        format: int64
        example: 1
      exam_id:
        type: integer
        format: int64
        example: 1
      exam_title:
        type: string
      name:
        type: string
      starts_at:
        type: string
        format: date-time
      ends_at:
        type: string
        format: date-time
      state:
        type: string
        enum:
        - upcoming
        - running
        - ended
  Student:
    type: object
    properties:
      id:
        type: integer
        format: int64
        example: 1
      code:
        type: string
      fullname:
        type: string
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
  Problem:
    type: object
    properties:
      id:
        type: integer
        format: int64
        example: 1
      exam_id:
        type: integer
        format: int64
        example: 1
      code:
        type: string
      title:
        type: string
      statement:
        type: string
      time_limit_ms:
        type: integer
        format: int64
        example: 1000
      memory_limit_mb:
        type: integer
        format: int64
        example: 256
      version:
        type: integer
        format: int64
        example: 1
      test_dir:
        type: string
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
  SubmissionResult:
    type: object
    properties:
      run_id:
        type: integer
        format: int64
      problem_version:
        type: integer
      status:
        type: string
        enum:
        - queued
        - judging
        - completed
        - system_error
      verdict:
        type: string
        enum:
        - AC
        - WA
        - TLE
        - MLE
        - CE
        - RE
        x-nullable: true
      passed_tests:
        type: integer
      total_tests:
        type: integer
      compiler_info:
        type: string
      compile_output:
        type: string
      system_error:
        type: string
        description: Chỉ GV
      created_at:
        type: string
        format: date-time
      started_at:
        type: string
        format: date-time
        x-nullable: true
      finished_at:
        type: string
        format: date-time
        x-nullable: true
  Submission:
    type: object
    properties:
      id:
        type: integer
        format: int64
      session_id:
        type: integer
        format: int64
      problem_id:
        type: integer
        format: int64
      problem_code:
        type: string
      student_id:
        type: integer
        format: int64
      student_code:
        type: string
      student_fullname:
        type: string
      received_at:
        type: string
        format: date-time
      problem_version:
        type: integer
      result:
        $ref: '#/definitions/SubmissionResult'
  TestResult:
    type: object
    properties:
      test_case_id:
        type: integer
        format: int64
      verdict:
        type: string
        enum:
        - AC
        - WA
        - TLE
        - MLE
        - RE
      execution_time_ms:
        type: integer
      memory_used_kb:
        type: integer
        format: int64
        x-nullable: true
  ProblemSummary:
    type: object
    required:
    - id
    - code
    - title
    properties:
      id:
        type: integer
        format: int64
        example: 1
      code:
        type: string
        example: A
      title:
        type: string
        example: Tổng hai số
  ExamDetail:
    allOf:
    - $ref: '#/definitions/Exam'
    - type: object
      required:
      - problems
      properties:
        problems:
          type: array
          description: Tất cả problem của đề, sắp theo code rồi id; rỗng là []. Không phân trang.
          items:
            $ref: '#/definitions/ProblemSummary'
  BoardLatest:
    type: object
    properties:
      submission_id:
        type: integer
        format: int64
      status:
        type: string
        x-nullable: true
      verdict:
        type: string
        x-nullable: true
      passed_tests:
        type: integer
      total_tests:
        type: integer
  BoardCell:
    type: object
    properties:
      problem_id:
        type: integer
        format: int64
      state:
        type: string
        enum:
        - ac
        - pending
        - attempted
        - none
      submissions:
        type: integer
      latest:
        $ref: '#/definitions/BoardLatest'
  BoardRow:
    type: object
    properties:
      student_id:
        type: integer
        format: int64
      student_code:
        type: string
      student_fullname:
        type: string
      status:
        type: string
        enum:
        - in_progress
        - finished
      online:
        type: boolean
      ac_count:
        type: integer
      cells:
        type: array
        items:
          $ref: '#/definitions/BoardCell'
  Summary:
    type: object
    properties:
      session_id:
        type: integer
        format: int64
      problems_total:
        type: integer
      problems:
        type: array
        items:
          $ref: '#/definitions/ProblemSummary'
      rows:
        type: array
        items:
